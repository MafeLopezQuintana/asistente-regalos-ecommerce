name: CI

# Corre en cada Pull Request contra main, y también en cada push directo
# a main (por si alguna vez se salta la regla, igual queda registrado).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Correr todos los tests (calidad de datos, categorías y modelos)
        run: pytest tests/ -v
